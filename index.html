<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMarket</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="navbar/navbar.css">

    <!-- Fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">AutoMarket</div>

        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Explorar</a></li>
            <li><a href="#">Comprar</a></li>
            <li><a href="#">Vender</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>

        <div class="nav-actions">
            <a href="#" class="login">Iniciar sesión</a>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- BUSCADOR -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" placeholder="Buscar autos, marcas o modelos...">
                <button>🔍</button>
            </div>
        </section>

        <!-- LISTADO DE AUTOS -->
        <section class="autos">

            <div class="auto">
                <img src="https://cdn.pixabay.com/photo/2016/11/29/09/32/auto-1868726_1280.jpg" alt="Honda Civic">
                <h3>Honda Civic</h3>
                <p>Año: 2021</p>
                <p>Precio: $17,500</p>
                <button>Ver más</button>
            </div>

            <div class="auto">
                <img src="https://cdn.pixabay.com/photo/2017/03/27/14/56/auto-2179220_1280.jpg" alt="Hyundai Elantra">
                <h3>Hyundai Elantra</h3>
                <p>Año: 2023</p>
                <p>Precio: $19,200</p>
                <button>Ver más</button>
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 AutoMarket - Todos los derechos reservados</p>
    </footer>

</body>
</html>
