<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoElite - Registro</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="register-container">
        <form id="registerForm" class="register-form">
            <h2>AUTO<span>ELITE</span></h2>
            <p>Crea tu cuenta de cliente</p>
            
            <div class="input-group">
                <label for="reg-name">Nombre Completo</label>
                <input type="text" id="reg-name" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <button type="submit" class="btn-register">Registrarse</button>
            
            <p class="switch-text">
                ¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a>
            </p>
            <p id="reg-message" class="message"></p>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const message = document.getElementById('reg-message');
            
            // Simulación visual de éxito
            message.style.color = "#2ecc71";
            message.textContent = "¡Cuenta creada! Redirigiendo al login...";
            
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        });
    </script>
</body>
</html>
